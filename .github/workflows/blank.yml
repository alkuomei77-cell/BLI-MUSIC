
name: Build BLI MUSIC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o BLI_MUSIC_Mobile_Project.zip -d extracted

      - name: Build APK
        run: |
          cd extracted
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLI-MUSIC-APK
          path: extracted/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
